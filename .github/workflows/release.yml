name: Build and Release

# The workflow validates the project, runs the test suite, builds a signed
# release APK and publishes it as a GitHub Release.
#
# Signing credentials are read from repository secrets. The keystore is stored
# as a base64 encoded secret so that no key material is ever committed.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (stable or beta)'
        required: false
        default: 'stable'
      dry_run:
        description: 'Build only, do not publish a release'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

  build:
    name: Build signed APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Decode release keystore
        if: ${{ env.DMS_KEYSTORE_BASE64 != '' }}
        env:
          DMS_KEYSTORE_BASE64: ${{ secrets.DMS_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$DMS_KEYSTORE_BASE64" | base64 --decode > android/keystore/dms-release.jks

      - name: Configure signing
        if: ${{ env.DMS_KEYSTORE_BASE64 != '' }}
        env:
          DMS_KEYSTORE_PASSWORD: ${{ secrets.DMS_KEYSTORE_PASSWORD }}
          DMS_KEY_ALIAS: ${{ secrets.DMS_KEY_ALIAS }}
          DMS_KEY_PASSWORD: ${{ secrets.DMS_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=keystore/dms-release.jks
          storePassword=$DMS_KEYSTORE_PASSWORD
          keyAlias=$DMS_KEY_ALIAS
          keyPassword=$DMS_KEY_PASSWORD
          EOF

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
          NAME="${VERSION%%+*}"
          CODE="${VERSION##*+}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      - name: Verify the APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: dist

      - name: Name the asset and compute the checksum
        run: |
          cp dist/app-release-apk dist/DiscordMediaSender.apk
          cd dist
          sha256sum DiscordMediaSender.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DiscordMediaSender.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Discord Media Sender ${{ github.ref_name }}

            Application id: `com.dmsender.discord_media_sender`

            Verify the download before installing:

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            The APK is signed with the persistent release key, so it installs
            over an existing installation without losing any user data.

            Download `SHA256SUMS.txt` and verify the APK before installing it:

            ```
            sha256sum -c SHA256SUMS.txt
            ```
