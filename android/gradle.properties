# The build has to run in constrained CI containers as well as on developer
# machines, so the JVM heaps are kept small and the Kotlin compiler runs inside
# the Gradle daemon instead of a second JVM.
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
