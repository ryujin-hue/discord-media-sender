# Gradle settings for Discord Media Sender.
#
# The values here are the ones a normal developer machine and a GitHub Actions
# runner expect. Machines with very little memory (CI containers with 2 GB, or
# a laptop with 4 GB) can still build the project by overriding these values
# in their own `~/.gradle/gradle.properties`, for example:
#
#   org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=384m
#   org.gradle.workers.max=1
#   org.gradle.parallel=false
#   org.gradle.daemon=false
#   kotlin.compiler.execution.strategy=in-process
#
# A user level `~/.gradle/gradle.properties` overrides this file, so the
# project keeps full speed on normal machines and still builds on small ones.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=true
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
